<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>仙途 - 修仙文字冒险</title>
<style>
:root {
  --bg: #0d0d1a;
  --panel: #141428;
  --gold: #d4a853;
  --text: #c8c0b8;
  --dim: #7a7268;
  --accent: #5b8def;
  --danger: #d94a4a;
  --heal: #4acd6b;
  --rare: #b85be0;
  --epic: #e0883a;
  --legend: #e04040;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;background:var(--bg);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--text)}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}

/* 顶部状态栏 */
#topbar{background:var(--panel);padding:10px 14px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0}
#topbar .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3a3050,#1a1030);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:2px solid var(--gold)}
#topbar .info{flex:1;min-width:0}
#topbar .name{font-weight:bold;font-size:16px;color:#f0e6d8}
#topbar .realm{font-size:12px;color:var(--gold)}
#topbar .stats{display:flex;gap:12px;margin-top:2px;font-size:11px;color:var(--dim)}
#topbar .stats span{white-space:nowrap}

/* 标签栏 */
#tabs{display:flex;flex-shrink:0;background:var(--panel);border-bottom:1px solid rgba(255,255,255,0.06)}
#tabs button{flex:1;padding:10px 4px;background:none;border:none;color:var(--dim);font-size:13px;
  cursor:pointer;transition:.2s;position:relative;font-family:inherit}
#tabs button.active{color:var(--gold);font-weight:bold}
#tabs button.active::after{content:'';position:absolute;bottom:0;left:25%;right:25%;height:2px;background:var(--gold)}

/* 内容区 */
#content{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch;
  scroll-behavior:smooth}
#content::-webkit-scrollbar{width:3px}
#content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

/* 日志区 */
#log{padding:8px 0}
.log-entry{padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;line-height:1.6;animation:fadeIn .3s}
.log-entry.sys{color:#8ab4f8}
.log-entry.combat{color:#f09060}
.log-entry.loot{color:var(--gold)}
.log-entry.break{color:var(--rare);font-weight:bold}
.log-entry.danger{color:var(--danger)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* 面板 */
.panel{display:none}
.panel.active{display:block}

/* 卡片 */
.card{background:var(--panel);border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.06)}
.card h3{font-size:14px;color:var(--gold);margin-bottom:8px}
.card .row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px}
.card .row .val{color:#ccc}

.btn{display:inline-block;padding:10px 18px;border:none;border-radius:8px;font-size:14px;cursor:pointer;
  font-family:inherit;transition:.2s;font-weight:bold;margin:3px}
.btn:active{transform:scale(.95)}
.btn-gold{background:linear-gradient(135deg,#c8943a,#a07020);color:#fff}
.btn-blue{background:linear-gradient(135deg,#4a80d0,#3050a0);color:#fff}
.btn-red{background:linear-gradient(135deg,#d05050,#903030);color:#fff}
.btn-green{background:linear-gradient(135deg,#4ab860,#308040);color:#fff}
.btn-purple{background:linear-gradient(135deg,#8a50c0,#6030a0);color:#fff}
.btn-outline{background:none;border:1px solid var(--gold);color:var(--gold)}
.btn-block{display:block;width:100%;text-align:center;margin:5px 0}
.btn-sm{padding:6px 12px;font-size:12px}

/* 进度条 */
.progress-bar{height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;margin:4px 0}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .4s}
.fill-hp{background:linear-gradient(90deg,#e04040,#f06060)}
.fill-mp{background:linear-gradient(90deg,#4080e0,#60a0f0)}
.fill-exp{background:linear-gradient(90deg,#c89040,#e0b050)}
.fill-cd{background:linear-gradient(90deg,#707070,#909090)}

/* 战斗区 */
#battle-area{display:none}
#battle-area.active{display:block}
.enemy-card{background:var(--panel);border-radius:10px;padding:12px;margin-bottom:10px;text-align:center;
  border:1px solid var(--danger)}
.enemy-card .enemy-name{font-size:18px;color:var(--danger);font-weight:bold}
.enemy-card .enemy-realm{font-size:12px;color:var(--dim);margin:2px 0}
.enemy-card .enemy-hp{margin:8px 0}

#skill-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
#skill-bar button{min-width:60px}

/* 装备显示 */
.equip-item{display:flex;align-items:center;gap:10px;padding:8px;background:rgba(255,255,255,0.03);border-radius:8px;margin:4px 0}
.equip-item .q-icon{font-size:20px;flex-shrink:0}
.equip-item .q-info{flex:1;min-width:0}
.equip-item .q-name{font-size:13px;font-weight:bold}
.equip-item .q-stat{font-size:11px;color:var(--dim)}

/* 商店/背包列表 */
.item-list{max-height:300px;overflow-y:auto}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px}
.item-row .item-cost{color:var(--gold);font-weight:bold;flex-shrink:0;margin-left:8px}

/* 特色文字颜色 */
.c-gold{color:var(--gold)}
.c-accent{color:var(--accent)}
.c-danger{color:var(--danger)}
.c-heal{color:var(--heal)}
.c-rare{color:var(--rare)}
.c-epic{color:var(--epic)}
.c-legend{color:var(--legend)}
.c-dim{color:var(--dim)}

/* 响应式 */
@media(max-width:380px){
  #tabs button{font-size:11px;padding:8px 2px}
  #topbar{padding:8px 10px}
  .btn{padding:8px 14px;font-size:13px}
}
</style>
</head>
<body>
<div id="app">

        <div class="progress-bar"><div class="fill fill-exp" id="exp-bar" style="width:0%"></div></div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-gold" onclick="doMeditate()">🧘 修炼 (灵力)</button>
          <button class="btn btn-blue" onclick="doAbsorb()">💎 吸收灵石</button>

      </div>
      <div class="card">

        <div class="row"><span>灵力</span><span class="val" id="stat-mp">50/50</span></div>
        <div class="row"><span>攻击</span><span class="val" id="stat-atk">10</span></div>
        <div class="row"><span>防御</span><span class="val" id="stat-def">5</span></div>
        <div class="row"><span>神识</span><span class="val" id="stat-sen">5</span></div>
        <div class="row"><span>悟性</span><span class="val" id="stat-ins">10</span></div>

        <div class="row"><span>五行亲和</span><span class="val" id="stat-elem">金</span></div>
      </div>
    </div>

    <!-- 战斗面板 -->
    <div class="panel" id="panel-battle-panel">
      <div id="battle-area">
        <div class="enemy-card" id="enemy-card">
          <div class="enemy-name" id="enemy-name"></div>
          <div class="enemy-realm" id="enemy-realm"></div>
          <div class="progress-bar"><div class="fill fill-hp" id="enemy-hp-bar" style="width:100%"></div></div>
          <div style="font-size:12px;color:var(--dim)" id="enemy-hp-text"></div>
        </div>
        <div id="skill-bar"></div>
        <div id="battle-log" style="margin-top:8px;font-size:12px;max-height:150px;overflow-y:auto"></div>
      </div>
      <div id="no-battle" style="text-align:center;padding:30px;color:var(--dim)">
        🕊️ 当前没有战斗<br>
        <button class="btn btn-outline" style="margin-top:12px" onclick="exploreBattle()">🔍 寻找对手</button>
      </div>
    </div>

    <!-- 装备面板 -->
    <div class="panel" id="panel-equip">
      <div class="card">
        <h3>⚔️ 当前武器</h3>
        <div id="current-weapon" style="padding:8px 0">空手</div>
      </div>
      <div class="card">
        <h3>🎒 背包</h3>
        <div id="inventory" style="max-height:350px;overflow-y:auto">空空如也</div>
      </div>
    </div>

    <!-- 探索面板 -->
    <div class="panel" id="panel-explore">
      <div class="card">
        <h3>🗺️ 秘境探索</h3>

      </div>
      <div class="card">
        <h3>📜 当前任务</h3>

    </div>

    <!-- 坊市面板 -->
    <div class="panel" id="panel-shop">

        <h3>🏪 仙域坊市</h3>

        <div class="item-list" id="shop-list"></div>
      </div>
    </div>
  </div>
</div>

};

// ── 主线任务链 ──
const QUEST_LINE = [
  { realm:0, title:'初窥门径', desc:'修为达到炼气初期', check:(g)=>g.realm>=1, reward:'灵石+100' },
  { realm:3, title:'小有所成', desc:'修为达到炼气后期', check:(g)=>g.realm>=3, reward:'灵石+300，获得灵品武器' },
  { realm:4, title:'筑基大道', desc:'突破至筑基期', check:(g)=>g.realm>=4, reward:'灵石+800，获得宝品武器' },
  { realm:7, title:'金丹真人', desc:'凝成金丹', check:(g)=>g.realm>=7, reward:'灵石+2000，获得仙品武器' },
  { realm:10,title:'元婴老怪', desc:'化婴成功', check:(g)=>g.realm>=10, reward:'灵石+5000' },
  { realm:18,title:'飞升成仙', desc:'渡劫飞升', check:(g)=>g.realm>=18, reward:'恭喜通关！' },
];

// ═══════════════════ 游戏状态 ═══════════════════
const G = {
  name:'无名修士',
  realm:0, // REALMS索引
  exp:0,
  hp:100, maxHp:100,
  mp:50, maxMp:50,
  atk:10, def:5,
  baseAtk:10, baseDef:5,
  sen:5, ins:10, bone:8,
  element:'金',
  sp:0, // 灵石
  weapon:null, // 装备的武器对象
  inventory:[], // 背包(武器+丹药)
  questIdx:0,
  storyDone:false,
  buffs:{}, // {atkBoost:3} 剩余回合
};

let inBattle = false;
let enemy = null;
let battleTurn = 0;
let currentTab = 'main';

// ═══════════════════ 核心函数 ═══════════════════

function r(n){ return Math.floor(Math.random()*n) }
function pick(arr){ return arr[r(arr.length)] }

function realmData(){ return REALMS[G.realm] }
function recalcStats(){
  const rd = realmData();
  G.maxHp = rd.hp + (G.weapon?.hpBonus||0);
  G.maxMp = rd.mp + (G.weapon?.mpBonus||0);
  G.baseAtk = rd.atk + (G.weapon?.atk||0);
  G.baseDef = rd.def + (G.weapon?.defBonus||0);
  G.atk = G.baseAtk; G.def = G.baseDef;
  if(G.buffs.atkBoost>0) G.atk = Math.floor(G.atk*1.3);
  if(G.buffs.defBoost>0) G.def = Math.floor(G.def*1.3);
  if(G.hp > G.maxHp) G.hp = G.maxHp;
  if(G.mp > G.maxMp) G.mp = G.maxMp;
}

function addLog(msg, cls=''){
  const div = document.createElement('div');
  div.className = 'log-entry ' + (cls||'');
  div.textContent = msg;
  const log = document.getElementById('log');
  log.appendChild(div);
  // 限制日志数量
  while(log.children.length > 50) log.removeChild(log.firstChild);
  document.getElementById('content').scrollTop = 0;
}

function canAfford(n){ return G.sp >= n }

function equipWeapon(w){
  if(G.weapon){
    G.inventory.push(G.weapon);
    addLog(`卸下 ${G.weapon.icon} ${G.weapon.name}`,'sys');
  }
  G.weapon = w;
  // 从背包移除
  const idx = G.inventory.findIndex(i=>i===w);
  if(idx>=0) G.inventory.splice(idx,1);
  recalcStats();
  addLog(`装备 ${w.icon} <span class="c-gold">${w.name}</span> [${w.quality}] ${w.atk?`攻击+${w.atk}`:''} ${w.bonus}`,'loot');
}

function gainExp(amt){
  G.exp += amt;
  const rd = realmData();
  if(G.realm >= REALMS.length-1){ G.exp=0; return; }
  while(G.exp >= rd.exp && G.realm < REALMS.length-1){
    G.exp -= rd.exp;
    G.realm++;
    const newRd = REALMS[G.realm];
    G.hp = newRd.hp; G.mp = newRd.mp;
    recalcStats();
    addLog(`🌟 突破！晋升 <span class="c-rare">${newRd.name}</span>！`,'break');
    checkQuest();
    if(G.realm===4) addLog('📜 你成功筑基，寿元大增，在宗门中的地位大幅提升。','sys');
    if(G.realm===7) addLog('📜 金丹大成！天空中降下金色光柱，你感受到了天地法则的脉动。','sys');
    if(G.realm===10) addLog('📜 元婴凝结！你的神魂可以离体遨游，天下之大皆可去得。','sys');
    if(G.realm===18) addLog('🏆 恭喜飞升成仙！你已超脱三界，位列仙班！','break');
  }
  refreshUI();
}

function checkQuest(){
  const q = QUEST_LINE[G.questIdx];
  if(q && q.check(G)){
    addLog(`✅ 任务完成：<span class="c-gold">${q.title}</span> — ${q.reward}`,'loot');
    if(q.realm===3 && !G.weapon) equipRandomWeapon('uncommon');
    if(q.realm===4 && (!G.weapon || G.weapon.quality==='凡品'||G.weapon.quality==='灵品')) equipRandomWeapon('rare');
    if(q.realm===7) { G.sp+=2000; equipRandomWeapon('epic'); }
    if(G.questIdx===4) G.sp+=5000;
    G.questIdx++;
  }
}

function equipRandomWeapon(tier){
  const pool = WEAPON_POOL[tier];
  if(!pool) return;
  const w = {...pick(pool)};
  G.inventory.push(w);
  equipWeapon(w);
}

// ═══════════════════ 修炼 ═══════════════════
function doMeditate(){
  if(inBattle){ addLog('战斗中无法修炼！','danger'); return; }
  const cost = 15;
  if(G.mp < cost){ addLog('灵力不足，无法修炼！','danger'); return; }
  G.mp -= cost;
  const gain = 10 + G.ins + r(15);
  gainExp(gain);
  addLog(`🧘 你静心修炼，获得了 <span class="c-gold">${gain}</span> 修为。`,'sys');
  refreshUI();
}

function doAbsorb(){
  if(inBattle){ addLog('战斗中无法吸收灵石！','danger'); return; }
  if(G.sp < 10){ addLog('灵石不足！（需要10灵石）','danger'); return; }
  G.sp -= 10;
  const gain = 35 + G.bone + r(20);
  gainExp(gain);
  addLog(`💎 你吸收灵石中的灵力，获得 <span class="c-gold">${gain}</span> 修为。`,'sys');
  refreshUI();
}

// ═══════════════════ 探索 ═══════════════════
function doExplore(){
  if(inBattle){ addLog('先结束战斗再探索！','danger'); return; }
  const evt = pick(EXPLORE_EVENTS);
  if(evt.effect==='battle'){
    exploreBattle();
    return;
  }
  if(evt.effect==='heal'){ G.hp = Math.min(G.maxHp, G.hp+evt.val); addLog(evt.text+` (恢复${evt.val}生命)`,'loot'); }
  if(evt.effect==='sp'){ G.sp += evt.val; addLog(evt.text,'loot'); }
  if(evt.effect==='exp'){ addLog(evt.text,'loot'); gainExp(evt.val); }
  if(evt.effect==='weapon'){
    const tiers = ['common','common','uncommon','uncommon','rare'];
    const tier = tiers[r(tiers.length)];
    const w = {...pick(WEAPON_POOL[tier])};
    G.inventory.push(w);
    addLog(`${evt.text} 获得 ${w.icon} <span class="c-gold">${w.name}</span> [${w.quality}]`,'loot');
  }
  if(evt.effect==='event'){
    if(evt.alt && r(2)===0){
      addLog(evt.alt,'sys');
      if(evt.altEff==='exp') gainExp(evt.altVal);
    } else {
      if(evt.val<0){ G.sp = Math.max(0, G.sp+evt.val); }
    }
    addLog(evt.text,'sys');
  }
  refreshUI();
}

function exploreBattle(){
  const rl = Math.max(0, G.realm-1+r(4));
  const rdEnemy = REALMS[Math.min(rl, REALMS.length-2)];
  const names = ['山贼', '妖兽·赤练蛇', '魔修', '石傀儡', '血蝙蝠', '尸鬼', '千年树妖', '剑灵残影', '阴煞', '妖狼'];
  enemy = {
    name: pick(names),
    realm: rdEnemy.name,
    hp: rdEnemy.hp + r(Math.floor(rdEnemy.hp*0.3)),
    maxHp: rdEnemy.hp + r(Math.floor(rdEnemy.hp*0.3)),
    atk: rdEnemy.atk + r(Math.floor(rdEnemy.atk*0.3)),
    def: rdEnemy.def + r(Math.floor(rdEnemy.def*0.2)),
    spReward: 15 + rl*8 + r(30),
    expReward: 30 + rl*12 + r(40),
  };
  enemy.maxHp = enemy.hp;
  inBattle = true;
  battleTurn = 0;
  document.getElementById('no-battle').style.display = 'none';
  document.getElementById('battle-area').classList.add('active');
  switchTab('battle-panel');
  updateBattleUI();
  addLog(`⚔️ 遭遇 <span class="c-danger">${enemy.name}</span>（${enemy.realm}）！`,'combat');
}
// ═══════════════════ 战斗 ═══════════════════
const SKILLS = [
  { name:'普通攻击', icon:'⚔️', mp:0, dmg:1.0, desc:'基础攻击', color:'btn-blue' },
  { name:'全力一击', icon:'💥', mp:20, dmg:1.8, desc:'消耗20灵力·高伤害', color:'btn-red' },
  { name:'剑气纵横', icon:'🌀', mp:30, dmg:1.4, desc:'消耗30灵力·范围斩击', color:'btn-purple', aoe:true },
  { name:'防御姿态', icon:'🛡️', mp:10, dmg:0.3, desc:'消耗10灵力·提升防御2回合', color:'btn-green', buff:'defBoost', buffVal:3 },
  { name:'嗜血狂攻', icon:'🩸', mp:35, dmg:2.2, desc:'消耗35灵力·暴击伤害', color:'btn-red', crit:true },
];

function doSkill(idx){
  if(!inBattle) return;
  const sk = SKILLS[idx];
  if(G.mp < sk.mp){ addLog(`灵力不足！（需要${sk.mp}）`,'danger'); updateBattleUI(); return; }
  G.mp -= sk.mp;
  // 计算伤害
  let dmg = Math.floor(G.atk * sk.dmg);
  // crit
  if(sk.crit || r(100) < 3 + G.sen){
    dmg = Math.floor(dmg * 1.8);
    addLog(`🎯 暴击！`,'combat');
  }
  // aoe bonus
  if(sk.aoe){ dmg = Math.floor(dmg * 1.15); }
  dmg = Math.max(1, dmg - Math.floor(enemy.def*0.3));
  dmg += r(6) - 3;
  dmg = Math.max(1, dmg);
  enemy.hp -= dmg;
  addLog(`你使用 <span class="c-accent">${sk.name}</span>，对${enemy.name}造成 <span class="c-danger">${dmg}</span> 伤害。`,'combat');
  // buff
  if(sk.buff){
    G.buffs[sk.buff] = (G.buffs[sk.buff]||0) + sk.buffVal;
    recalcStats();
    addLog(`🛡️ 防御提升！持续${sk.buffVal}回合`,'sys');
  }

  if(enemy.hp <= 0){
    winBattle();
    return;
  }

  // 敌人回合
  enemyTurn();
  updateBattleUI();
}

function enemyTurn(){
  const eDmg = Math.max(1, enemy.atk - Math.floor(G.def*0.4) + r(8) - 4);
  G.hp -= eDmg;
  addLog(`${enemy.name} 攻击你，造成 <span class="c-danger">${eDmg}</span> 伤害。`,'combat');
  if(G.hp <= 0){
    G.hp = 0;
    addLog('💀 你被击败了！损失了一些灵石...','danger');
    G.sp = Math.max(0, G.sp - Math.floor(G.sp*0.3));
    G.hp = Math.floor(G.maxHp*0.5);
    endBattle();
    return;
  }
  // 衰减buff
  for(const k in G.buffs){
    G.buffs[k]--;
    if(G.buffs[k]<=0) delete G.buffs[k];
  }
  recalcStats();
}

function winBattle(){
  addLog(`🎉 击败了 <span class="c-danger">${enemy.name}</span>！`,'loot');
  G.sp += enemy.spReward;
  addLog(`获得灵石 <span class="c-gold">+${enemy.spReward}</span>`,'loot');
  gainExp(enemy.expReward);
  addLog(`获得修为 <span class="c-gold">+${enemy.expReward}</span>`,'loot');
  // 概率掉落
  if(r(5)===0){
    const tiers = ['common','common','uncommon'];
    if(G.realm>=4) tiers.push('rare');
    if(G.realm>=7) tiers.push('epic');
    const tier = tiers[r(tiers.length)];
    const w = {...pick(WEAPON_POOL[tier])};
    G.inventory.push(w);
    addLog(`🎁 掉落武器：${w.icon} <span class="c-gold">${w.name}</span> [${w.quality}]`,'loot');
  }
  endBattle();
}

function endBattle(){
  inBattle = false;
  enemy = null;
  document.getElementById('no-battle').style.display = '';
  document.getElementById('battle-area').classList.remove('active');
  // 回到主页
  switchTab('main');
  refreshUI();
}

function updateBattleUI(){
  if(!enemy) return;
  document.getElementById('enemy-name').textContent = enemy.name;
  document.getElementById('enemy-realm').textContent = enemy.realm;
  const pct = Math.max(0, Math.floor(enemy.hp/enemy.maxHp*100));
  document.getElementById('enemy-hp-bar').style.width = pct+'%';
  document.getElementById('enemy-hp-text').textContent = `❤️ ${enemy.hp} / ${enemy.maxHp}`;
  // 技能栏
  const bar = document.getElementById('skill-bar');
  bar.innerHTML = SKILLS.map((sk,i)=>{
    const disabled = G.mp < sk.mp ? 'disabled style="opacity:0.5"' : '';
    return `<button class="btn ${sk.color} btn-sm" onclick="doSkill(${i})" ${disabled}>${sk.icon} ${sk.name}<br><small>${sk.desc}</small></button>`;
  }).join('');
}

// ═══════════════════ UI刷新 ═══════════════════
function refreshUI(){
  const rd = realmData();
  document.getElementById('p-name').textContent = G.name;
  document.getElementById('p-realm').textContent = rd.name;
  document.getElementById('p-hp').textContent = `${G.hp}/${G.maxHp}`;
  document.getElementById('p-sp').textContent = G.sp;
  // 头像
  const avatars = ['🧘','🧙','🧝','🧞','🦸','🧛','🧜','🦹','👼','🧚','🦸‍♂️','🧝‍♂️','👨‍🔬','🦹‍♂️','🧙‍♂️','👑','🔮','✨','🌟'];
  document.getElementById('avatar-icon').textContent = avatars[Math.min(G.realm, avatars.length-1)];

  // 主面板
  document.getElementById('exp-text').textContent = `${G.exp} / ${rd.exp}`;
  document.getElementById('exp-bar').style.width = Math.min(100, Math.floor(G.exp/rd.exp*100))+'%';
  document.getElementById('stat-hp').textContent = `${G.hp}/${G.maxHp}`;
  document.getElementById('stat-mp').textContent = `${G.mp}/${G.maxMp}`;
  document.getElementById('stat-atk').textContent = G.atk;
  document.getElementById('stat-def').textContent = G.def;
  document.getElementById('stat-sen').textContent = G.sen;
  document.getElementById('stat-ins').textContent = G.ins;
  document.getElementById('stat-bone').textContent = G.bone;

  // 装备面板
  const weDiv = document.getElementById('current-weapon');
  if(G.weapon){
    weDiv.innerHTML = `<span class="${G.weapon.qColor}" style="font-weight:bold">${G.weapon.icon} ${G.weapon.name}</span>
      <span style="color:var(--dim);margin-left:8px">[${G.weapon.quality}]</span>
      <br><span style="font-size:12px">${G.weapon.bonus} · 攻击+${G.weapon.atk||0}</span>`;
  } else {
    weDiv.textContent = '空手';
  }
  const invDiv = document.getElementById('inventory');
  if(G.inventory.length===0){
    invDiv.innerHTML = '<span style="color:var(--dim)">空空如也</span>';
  } else {
    invDiv.innerHTML = G.inventory.map((item,i)=>{
      if(item.atk!==undefined){
        // 武器
        return `<div class="equip-item">
          <span class="q-icon">${item.icon}</span>
          <div class="q-info"><div class="q-name" style="color:${item.qColor||'#ccc'}">${item.name} [${item.quality}]</div>
          <div class="q-stat">攻击+${item.atk} ${item.bonus}</div></div>
          <button class="btn btn-gold btn-sm" onclick="equipInventory(${i})">装备</button>
        </div>`;
      } else {
        // 丹药
        return `<div class="equip-item">
          <span class="q-icon">${item.icon}</span>
          <div class="q-info"><div class="q-name">${item.name}</div>
          <div class="q-stat">${item.desc}</div></div>
          <button class="btn btn-green btn-sm" onclick="usePill(${i})">使用</button>
        </div>`;
      }
    }).join('');
  }

  // 探索面板
  const q = QUEST_LINE[G.questIdx];
  document.getElementById('quest-info').innerHTML = q
    ? `<b>${q.title}</b><br><span style="color:var(--dim)">${q.desc}</span>`
    : '🏆 所有任务已完成！';

  // 商店
  document.getElementById('shop-sp').textContent = G.sp;
  const shopDiv = document.getElementById('shop-list');
  const allWeapons = [
    ...WEAPON_POOL.common.map(w=>({...w,tier:'common'})),
    ...WEAPON_POOL.uncommon.map(w=>({...w,tier:'uncommon'})),
    ...WEAPON_POOL.rare.map(w=>({...w,tier:'rare'})),
  ];
  if(G.realm>=7) allWeapons.push(...WEAPON_POOL.epic.map(w=>({...w,tier:'epic'})));
  if(G.realm>=13) allWeapons.push(...WEAPON_POOL.legend.map(w=>({...w,tier:'legend'})));
  shopDiv.innerHTML = allWeapons.map((w,i)=>{
    const aff = canAfford(w.cost) ? '' : 'style="opacity:0.4"';
    return `<div class="item-row" ${aff}>
      <span>${w.icon} <span style="color:${w.qColor}">${w.name}</span> <span class="c-dim">[${w.quality}]</span><br><small class="c-dim">攻击+${w.atk} ${w.bonus}</small></span>
      <button class="btn btn-gold btn-sm item-cost" onclick="buyWeapon('${w.tier}',${i})" ${!canAfford(w.cost)?'disabled':''}>💎${w.cost}</button>
    </div>`;
  }).join('');

  // 丹药区追加到商店
  shopDiv.innerHTML += '<div style="margin-top:10px;border-top:1px solid rgba(255,255,255,0.1);padding-top:8px"><b>🧪 丹药</b></div>';
  shopDiv.innerHTML += PILLS.map((p,i)=>{
    const aff = canAfford(p.cost) ? '' : 'style="opacity:0.4"';
    return `<div class="item-row" ${aff}>
      <span>${p.icon} ${p.name}<br><small class="c-dim">${p.desc}</small></span>
      <button class="btn btn-green btn-sm item-cost" onclick="buyPill(${i})" ${!canAfford(p.cost)?'disabled':''}>💎${p.cost}</button>
    </div>`;
  }).join('');

  updateBattleUI();
}

function equipInventory(idx){
  const item = G.inventory[idx];
  if(!item || item.atk===undefined) return;
  equipWeapon(item);
  refreshUI();
}

function usePill(idx){
  const item = G.inventory[idx];
  if(!item || item.atk!==undefined) return;
  if(item.effect==='hp'){ G.hp = Math.min(G.maxHp, G.hp+item.val); addLog(`使用 ${item.name}，恢复${item.val}生命`,'heal'); }
  if(item.effect==='mp'){ G.mp = Math.min(G.maxMp, G.mp+item.val); addLog(`使用 ${item.name}，恢复${item.val}灵力`,'heal'); }
  if(item.effect==='exp'){ gainExp(item.val); addLog(`使用 ${item.name}，获得${item.val}修为`,'loot'); }
  if(item.effect==='buff'){ G.buffs.atkBoost=(G.buffs.atkBoost||0)+5; recalcStats(); addLog(`使用 ${item.name}，攻击力提升30%持续5回合`,'sys'); }
  G.inventory.splice(idx,1);
  refreshUI();
}

function buyWeapon(tier, idx){
  const pool = WEAPON_POOL[tier];
  if(!pool) return;
  const w = pool[idx];
  if(!canAfford(w.cost)){ addLog('灵石不足！','danger'); return; }
  G.sp -= w.cost;
  const newW = {...w};
  G.inventory.push(newW);
  addLog(`购买 ${newW.icon} <span class="c-gold">${newW.name}</span> [${newW.quality}]`,'loot');
  refreshUI();
}

function buyPill(idx){
  const p = PILLS[idx];
  if(!canAfford(p.cost)){ addLog('灵石不足！','danger'); return; }
  G.sp -= p.cost;
  G.inventory.push({...p});
  addLog(`购买 ${p.icon} ${p.name}`,'loot');
  refreshUI();
}

// ═══════════════════ 标签切换 ═══════════════════
function switchTab(name){
  currentTab = name;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[data-tab="${name}"]`)?.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const panelMap = { main:'panel-main', 'battle-panel':'panel-battle-panel', equip:'panel-equip', explore:'panel-explore', shop:'panel-shop' };
  const panelId = panelMap[name];
  if(panelId) document.getElementById(panelId)?.classList.add('active');
  if(name==='battle-panel' && !inBattle){
    document.getElementById('no-battle').style.display = '';
    document.getElementById('battle-area').classList.remove('active');
  }
  refreshUI();
}

document.querySelectorAll('#tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab = btn.dataset.tab;
    if(tab==='battle-panel' && !inBattle){
      // 如果没有战斗，切换到战斗面板显示寻找对手
    }
    switchTab(tab);
  });
});

// ═══════════════════ 初始化 ═══════════════════
function initGame(){
  recalcStats();
  // 初始剧情
  if(!G.storyDone){
    addLog('📜 ' + STORY_NODES.start.title,'break');
    addLog(STORY_NODES.start.text,'sys');
    // 自动选择第一个选项开始
    const node = STORY_NODES.accept;
    addLog('📜 ' + node.title,'break');
    addLog(node.text,'sys');
    if(node.reward){
      G.sp += node.reward.sp||0;
      gainExp(node.reward.exp||0);
    }
    const jNode = STORY_NODES.journey;
    addLog('📜 ' + jNode.title,'break');
    addLog(jNode.text,'sys');
    if(jNode.reward){
      G.sp += jNode.reward.sp||0;
      gainExp(jNode.reward.exp||0);
      if(jNode.reward.weapon){
        const w = WEAPON_POOL.common.find(w=>w.name===jNode.reward.weapon);
        if(w){
          const nw = {...w};
          G.inventory.push(nw);
          equipWeapon(nw);
        }
      }
    }
    G.storyDone = true;
  }
  refreshUI();
}

initGame();

// ═══════════════════ 自动恢复 ═══════════════════
setInterval(()=>{
  if(inBattle) return;
  if(G.mp < G.maxMp){ G.mp = Math.min(G.maxMp, G.mp + 2); }
  if(G.hp < G.maxHp){ G.hp = Math.min(G.maxHp, G.hp + 1); }
  // buff衰减
  if(!inBattle){
    for(const k in G.buffs){
      G.buffs[k]--;
      if(G.buffs[k]<=0) delete G.buffs[k];
    }
    recalcStats();
  }
  refreshUI();
}, 3000);

console.log('🌟 仙途·修仙文字冒险 已就绪');
</script>

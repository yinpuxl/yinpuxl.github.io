<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>肉鸽地牢 · 通关版</title>
<style>
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
  body {
    background: #0a0c0f; min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    font-family: 'Courier New', monospace; padding: 16px;
  }
  .game-wrapper {
    background: #1a1e26; padding: 20px; border-radius: 32px;
    box-shadow: 0 20px 30px rgba(0,0,0,0.9), inset 0 0 8px #3b4b5e;
    border: 1px solid #3d5066; max-width: 520px; width: 100%;
  }
  .game-container {
    background: #0f1319; border-radius: 24px; padding: 18px;
    box-shadow: inset 0 0 20px #000, 0 0 0 2px #2e3d4f;
  }
  .status-panel {
    display: flex; flex-wrap: wrap; justify-content: space-between;
    align-items: center; gap: 10px; margin-bottom: 16px;
    color: #e0e9f0; font-weight: bold; font-size: 1rem;
  }
  .hp-bar {
    display: flex; align-items: center; gap: 6px; background: #1d262f;
    padding: 6px 14px; border-radius: 60px; border: 1px solid #4c6a7f;
  }
  .hp-value { color: #ffbaba; font-size: 1.2rem; }
  .stats {
    display: flex; gap: 16px; background: #1d262f;
    padding: 6px 16px; border-radius: 60px; border: 1px solid #4c6a7f;
  }
  .stat-item { display: flex; align-items: center; gap: 4px; }
  .gold { color: #ffd966; } .floor { color: #a3d0ff; } .attack { color: #ff8a5c; }
  .battlefield {
    background: #0b0e12; border-radius: 24px; padding: 20px 14px 14px;
    border: 2px solid #2a3a4a; box-shadow: inset 0 0 25px #000;
    margin-bottom: 16px; text-align: center;
  }
  .enemy-name {
    color: #c9dbe9; font-size: 1.1rem; letter-spacing: 2px;
    background: #1f2b36; padding: 4px 20px; border-radius: 40px;
    border: 1px solid #3e5b70; display: inline-block; margin-bottom: 8px;
  }
  .enemy-name.boss { color: #ffd700; border-color: #ffd700; box-shadow: 0 0 12px #ffd70088; }
  .enemy-sprite {
    font-size: 5rem; line-height: 1; filter: drop-shadow(0 0 15px currentColor);
    margin: 4px 0 8px; color: #b0c6d8; text-shadow: 0 0 30px #326180;
  }
  .enemy-hp-bar {
    width: 90%; max-width: 260px; height: 16px; background: #201f24;
    border-radius: 40px; border: 1px solid #4e6478; overflow: hidden;
    margin: 0 auto 6px;
  }
  .enemy-hp-fill {
    height: 100%; width: 100%; background: linear-gradient(90deg, #c42e2e, #e05a5a);
    border-radius: 40px; transition: width 0.2s ease; box-shadow: 0 0 10px #ff4b4b;
  }
  .enemy-stats {
    display: inline-flex; gap: 18px; font-size: 0.85rem; color: #bbd1e4;
    background: #151f28; padding: 3px 16px; border-radius: 40px;
  }
  .action-buttons {
    display: flex; gap: 10px; justify-content: center;
    margin-top: 14px; flex-wrap: wrap;
  }
  .btn {
    background: #283845; border: none; border-radius: 60px; padding: 12px 22px;
    font-family: inherit; font-weight: bold; font-size: 1rem; letter-spacing: 1px;
    color: #e7f2fa; border-bottom: 4px solid #121b22;
    box-shadow: 0 6px 0 #0d131a, 0 8px 15px #00000080; cursor: pointer;
    transition: all 0.07s ease; display: flex; align-items: center; gap: 6px;
    touch-action: manipulation;
  }
  .btn:active:not(:disabled) {
    transform: translateY(5px); border-bottom-width: 1px;
    box-shadow: 0 1px 0 #0d131a, 0 5px 12px #00000080;
  }
  .btn:disabled {
    opacity: 0.4; transform: translateY(3px); border-bottom-width: 2px;
    box-shadow: 0 2px 0 #0d131a; pointer-events: none; filter: grayscale(0.5);
  }
  .attack-btn { background: #3c2a2a; border-bottom-color: #1d1111; color: #ffbaba; }
  .heal-btn { background: #1d3a30; border-bottom-color: #10241d; color: #b6f0d6; }
  .flee-btn { background: #2f2b40; border-bottom-color: #191625; color: #cfc1ff; }
  .restart-btn { background: #2a3444; border-bottom-color: #121b26; color: #b8d4ff; }
  .log-box {
    background: #0d1117; border-radius: 16px; padding: 10px 14px; margin-top: 14px;
    height: 86px; overflow-y: auto; font-size: 0.85rem; color: #afc3d6;
    border: 1px solid #364b5c; box-shadow: inset 0 0 12px #000;
    line-height: 1.5; scrollbar-width: thin;
  }
  .log-box div { border-bottom: 1px solid #1e2a35; padding: 2px 0; }
  .log-box div:last-child { border-bottom: none; }
  .game-over-msg {
    text-align: center; font-size: 1.1rem; font-weight: bold; margin: 8px 0;
  }
  .game-over-msg.lose { color: #ff9f9f; text-shadow: 0 0 15px #ff0000; }
  .game-over-msg.win { color: #ffd966; text-shadow: 0 0 20px #ffbb00; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-container">
    <div class="status-panel">
      <div class="hp-bar"><span>❤️</span><span class="hp-value" id="hpDisplay">20 / 20</span></div>
      <div class="stats">
        <div class="stat-item">⚔️ <span class="attack" id="atkDisplay">3</span></div>
        <div class="stat-item">💰 <span class="gold" id="goldDisplay">0</span></div>
        <div class="stat-item">🏰 <span class="floor" id="floorDisplay">1</span></div>
      </div>
    </div>

    <div class="battlefield">
      <div class="enemy-name" id="enemyName">骷髅战士</div>
      <div class="enemy-sprite" id="enemySprite">💀</div>
      <div class="enemy-hp-bar"><div class="enemy-hp-fill" id="enemyHpFill" style="width:100%"></div></div>
      <div class="enemy-stats">
        <span>❤️ <span id="enemyHpText">12/12</span></span>
        <span>⚔️ <span id="enemyAtkText">3</span></span>
      </div>
    </div>

    <div class="action-buttons" id="actionButtons">
      <button class="btn attack-btn" id="attackBtn">⚔️ 攻击</button>
      <button class="btn heal-btn" id="healBtn">🧪 治疗 (2💰)</button>
      <button class="btn flee-btn" id="fleeBtn">🏃 逃跑</button>
    </div>

    <div id="gameOverMsg" class="game-over-msg hidden"></div>
    <div class="log-box" id="logBox"></div>
  </div>
</div>

<script>
(function() {
  const BOSS_FLOOR = 10; // 第10层为Boss层

  let player = { hp: 20, maxHp: 20, attack: 3, gold: 0, floor: 1 };
  let enemy = { name: '骷髅战士', sprite: '💀', hp: 12, maxHp: 12, attack: 3, isBoss: false };
  let gamePhase = 'battle'; // 'battle' | 'gameover' | 'victory'

  const hpDisplay = document.getElementById('hpDisplay');
  const atkDisplay = document.getElementById('atkDisplay');
  const goldDisplay = document.getElementById('goldDisplay');
  const floorDisplay = document.getElementById('floorDisplay');
  const enemyName = document.getElementById('enemyName');
  const enemySprite = document.getElementById('enemySprite');
  const enemyHpFill = document.getElementById('enemyHpFill');
  const enemyHpText = document.getElementById('enemyHpText');
  const enemyAtkText = document.getElementById('enemyAtkText');
  const attackBtn = document.getElementById('attackBtn');
  const healBtn = document.getElementById('healBtn');
  const fleeBtn = document.getElementById('fleeBtn');
  const logBox = document.getElementById('logBox');
  const gameOverMsg = document.getElementById('gameOverMsg');

  function log(msg) {
    const div = document.createElement('div');
    div.textContent = msg;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
    while (logBox.children.length > 40) logBox.removeChild(logBox.firstChild);
  }

  function updateUI() {
    hpDisplay.textContent = `${player.hp} / ${player.maxHp}`;
    atkDisplay.textContent = player.attack;
    goldDisplay.textContent = player.gold;
    floorDisplay.textContent = player.floor;

    enemyName.textContent = enemy.name;
    enemyName.classList.toggle('boss', !!enemy.isBoss);
    enemySprite.textContent = enemy.sprite;
    const pct = Math.max(0, (enemy.hp / enemy.maxHp) * 100);
    enemyHpFill.style.width = pct + '%';
    enemyHpText.textContent = `${enemy.hp}/${enemy.maxHp}`;
    enemyAtkText.textContent = enemy.attack;

    if (gamePhase === 'gameover' || gamePhase === 'victory') {
      attackBtn.disabled = true;
      healBtn.disabled = true;
      fleeBtn.disabled = true;
      gameOverMsg.classList.remove('hidden');

      if (!document.getElementById('restartBtn')) {
        const isWin = gamePhase === 'victory';
        gameOverMsg.className = 'game-over-msg ' + (isWin ? 'win' : 'lose');
        gameOverMsg.innerHTML = isWin
          ? '🏆 通关！你击败了地牢之主！<br>'
          : '💀 你已倒下... <br>';
        const btn = document.createElement('button');
        btn.id = 'restartBtn';
        btn.className = 'btn restart-btn';
        btn.textContent = '🔄 新的轮回';
        btn.style.marginTop = '10px';
        btn.addEventListener('click', resetGame);
        gameOverMsg.appendChild(btn);
      }
    } else {
      attackBtn.disabled = false;
      fleeBtn.disabled = false;
      healBtn.disabled = (player.gold < 2 || player.hp >= player.maxHp || player.hp <= 0);
      gameOverMsg.classList.add('hidden');
    }
  }

  function generateEnemy() {
    // Boss层特殊处理
    if (player.floor === BOSS_FLOOR) {
      const hp = 60 + Math.floor(Math.random() * 15);
      const atk = 8 + Math.floor(Math.random() * 3);
      enemy = { name: '地牢之主', sprite: '👑', hp, maxHp: hp, attack: atk, isBoss: true };
      log(`👑 第 ${BOSS_FLOOR} 层 · BOSS「地牢之主」出现！(❤️${hp} ⚔️${atk})`);
      return;
    }

    const names = [
      { name: '骷髅战士', sprite: '💀' }, { name: '洞穴蝙蝠', sprite: '🦇' },
      { name: '腐化史莱姆', sprite: '🟢' }, { name: '地穴蜘蛛', sprite: '🕷️' },
      { name: '幽灵', sprite: '👻' }, { name: '兽人斥候', sprite: '👹' },
      { name: '石像鬼', sprite: '🗿' }, { name: '地狱犬', sprite: '🐕' },
      { name: '暗影法师', sprite: '🧙' }, { name: '小恶魔', sprite: '😈' }
    ];
    const base = names[Math.floor(Math.random() * names.length)];
    const f = player.floor;
    const hp = Math.max(6, 8 + Math.floor(Math.random() * 6) + Math.floor(f * 2.2));
    const atk = Math.max(2, 2 + Math.floor(Math.random() * 3) + Math.floor(f * 0.7));
    let prefix = '';
    if (f >= 4 && Math.random() < 0.35) prefix = '精英·';
    enemy = { name: prefix + base.name, sprite: base.sprite, hp, maxHp: hp, attack: atk, isBoss: false };
    log(`⚔️ 第 ${f} 层遭遇 ${enemy.name} (❤️${enemy.hp} ⚔️${enemy.attack})`);
  }

  function onEnemyDeath() {
    // 检查是否击败Boss → 通关
    if (enemy.isBoss) {
      gamePhase = 'victory';
      log('🏆 你击败了地牢之主！通关成功！');
      updateUI();
      return;
    }

    const gold = 2 + Math.floor(player.floor / 2) + Math.floor(Math.random() * 3);
    player.gold += gold;
    log(`💰 击败敌人！获得 ${gold} 金币。`);
    if (Math.random() < 0.45 || player.floor % 3 === 0) {
      player.attack += 1;
      log(`⚔️ 攻击力提升至 ${player.attack}！`);
    }
    player.floor += 1;
    const heal = 2 + Math.floor(Math.random() * 3);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    log(`❤️ 恢复 ${heal} 点生命。进入第 ${player.floor} 层。`);
    generateEnemy();
    gamePhase = 'battle';
    updateUI();
  }

  function onPlayerDeath() {
    player.hp = 0;
    gamePhase = 'gameover';
    updateUI();
    log('💀 你被击败了... 地牢吞噬了你的灵魂。');
  }

  function playerAttack() {
    if (gamePhase !== 'battle') return;
    const dmg = player.attack + Math.floor(Math.random() * 2);
    enemy.hp = Math.max(0, enemy.hp - dmg);
    log(`⚔️ 你对 ${enemy.name} 造成 ${dmg} 点伤害。`);
    if (enemy.hp <= 0) { enemy.hp = 0; onEnemyDeath(); return; }

    const eDmg = Math.max(1, enemy.attack + Math.floor(Math.random() * 2) - 1);
    player.hp = Math.max(0, player.hp - eDmg);
    log(`💥 ${enemy.name} 反击，造成 ${eDmg} 点伤害。`);
    if (player.hp <= 0) { onPlayerDeath(); return; }
    updateUI();
  }

  function healPlayer() {
    if (gamePhase !== 'battle') return;
    if (player.gold < 2) { log('💰 金币不足。'); return; }
    if (player.hp >= player.maxHp) { log('❤️ 已满血，无需治疗。'); return; }
    player.gold -= 2;
    const heal = 6 + Math.floor(Math.random() * 4);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    log(`🧪 治疗恢复 ${heal} 点生命 (消耗2💰)。`);
    const eDmg = Math.max(1, enemy.attack + Math.floor(Math.random() * 2) - 1);
    player.hp = Math.max(0, player.hp - eDmg);
    log(`💥 ${enemy.name} 趁机攻击，造成 ${eDmg} 点伤害。`);
    if (player.hp <= 0) { onPlayerDeath(); return; }
    updateUI();
  }

  function flee() {
    if (gamePhase !== 'battle') return;
    // Boss层不能逃跑（增加挑战性）
    if (enemy.isBoss) { log('👑 无法从地牢之主手中逃脱！'); return; }

    const loss = Math.min(player.gold, 3 + Math.floor(Math.random() * 4));
    player.gold -= loss;
    log(`🏃 逃跑损失 ${loss} 金币。`);
    if (player.floor > 1) { player.floor -= 1; log(`⬇️ 退回第 ${player.floor} 层。`); }
    else log(`⬇️ 仍在地下第 ${player.floor} 层。`);
    const heal = 3 + Math.floor(Math.random() * 5);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    log(`❤️ 恢复 ${heal} 点生命。`);
    generateEnemy();
    gamePhase = 'battle';
    updateUI();
  }

  function resetGame() {
    player = { hp: 20, maxHp: 20, attack: 3, gold: 0, floor: 1 };
    gamePhase = 'battle';
    logBox.innerHTML = '';
    log('⚔️ 你踏入地牢，目标：击败第10层的地牢之主！');
    generateEnemy();
    updateUI();
    gameOverMsg.classList.add('hidden');
    gameOverMsg.innerHTML = '';
    const oldRestart = document.getElementById('restartBtn');
    if (oldRestart) oldRestart.remove();
  }

  function init() {
    attackBtn.addEventListener('click', playerAttack);
    healBtn.addEventListener('click', healPlayer);
    fleeBtn.addEventListener('click', flee);
    resetGame();
  }
  init();
})();
</script>
</body>
</html>

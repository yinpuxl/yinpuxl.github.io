<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>冒险跳跃 - 平台闯关</title>
<style>
  :root {
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: #1a1a2e;
    position: fixed;
    top: 0; left: 0;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 12px 16px;
    padding-bottom: calc(12px + var(--safe-bottom));
    pointer-events: none;
    z-index: 10;
    gap: 10px;
  }
  .btn-group {
    display: flex;
    gap: 8px;
    pointer-events: auto;
  }
  .ctrl-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:active, .ctrl-btn.pressed {
    background: rgba(255,255,255,0.4);
    border-color: rgba(255,255,255,0.8);
  }
  .ctrl-btn.jump {
    width: 80px; height: 80px;
    font-size: 18px;
    font-weight: bold;
    background: rgba(255,180,50,0.3);
    border-color: rgba(255,180,50,0.6);
    letter-spacing: 2px;
  }
  .ctrl-btn.jump:active, .ctrl-btn.jump.pressed {
    background: rgba(255,180,50,0.6);
    border-color: rgba(255,180,50,0.9);
  }
  #kb-hint {
    position: fixed;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-family: sans-serif;
    font-size: 11px;
    pointer-events: none;
    z-index: 10;
    text-align: center;
  }
  @media (hover: none) and (pointer: coarse) {
    #kb-hint { display: none; }
  }
  @media (min-width: 768px) {
    .ctrl-btn { width: 56px; height: 56px; font-size: 24px; }
    .ctrl-btn.jump { width: 70px; height: 70px; font-size: 16px; }
    #controls { padding: 16px 24px; padding-bottom: calc(16px + var(--safe-bottom)); }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="kb-hint">⌨ 方向键/A D 移动 · 空格/W/↑ 跳跃</div>

  <div class="btn-group">
    <button class="ctrl-btn" id="btn-left"  aria-label="左">◀</button>
    <button class="ctrl-btn" id="btn-right" aria-label="右">▶</button>
  </div>
  <div class="btn-group">
    <button class="ctrl-btn jump" id="btn-jump" aria-label="跳跃">跳</button>

// ─── 游戏状态 ───────────────────────────
let state = 'menu'; // menu | playing | dead | levelEnd | win
let curLevel = 0;
let score = 0;
let lives = 5;
let levelData = null;
let player, camera;
let particles = [];
let shakeTimer = 0;
let shakeIntensity = 0;
let deadTimer = 0;
let levelEndTimer = 0;
let coinSpin = 0;

function initLevel(idx) {
  levelData = JSON.parse(JSON.stringify(levels[idx]));
  // 还原易碎平台
  levelData.entities.forEach(e => {
    if (e.type === 'crumb') e.alive = true;
    if (e.type === 'moving') { e.ox = e.x; e.oy = e.y; }
  });
  player = {
    x: levelData.playerSpawn[0], y: levelData.playerSpawn[1],
    w: PLR_W, h: PLR_H,
    vx: 0, vy: 0,
    onGround: false,
    onMovingPlatform: null,
    facingRight: true,
  };
  camera = { x: 0, y: 0, tx: 0, ty: 0 };
  particles = [];
  shakeTimer = 0;
  shakeIntensity = 0;
}

function resetGame() {
  curLevel = 0;
  score = 0;
  lives = 5;
  initLevel(0);
  state = 'menu';
}

// ─── 碰撞检测辅助 ──────────────────────
function aabbOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function rectCircleOverlap(rx, ry, rw, rh, cx, cy, cr) {
  const closestX = Math.max(rx, Math.min(cx, rx + rw));
  const closestY = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - closestX;
  const dy = cy - closestY;
  return (dx * dx + dy * dy) < (cr * cr);
}

// ─── 粒子系统 ──────────────────────────
function spawnParticles(x, y, count, color, spread) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * spread;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      life: 1,
      decay: 0.02 + Math.random() * 0.04,
      color,
      size: 2 + Math.random() * 4,
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles(ctx, camX, camY) {
  for (const p of particles) {
    const alpha = p.life;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2 - camX, p.y - p.size/2 - camY, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ─── 游戏更新 ──────────────────────────
function update() {
  if (state === 'menu') return;
  if (state === 'dead') {
    deadTimer--;
    updateParticles();
    if (shakeTimer > 0) shakeTimer--;
    if (deadTimer <= 0) {
      if (lives <= 0) {
        resetGame();
        state = 'menu';
      } else {
        initLevel(curLevel);
        state = 'playing';
      }
    }
    return;
  }
  if (state === 'levelEnd') {
    levelEndTimer--;
    updateParticles();
    if (levelEndTimer <= 0) {
      curLevel++;
      if (curLevel >= levels.length) {
        state = 'win';
      } else {
        initLevel(curLevel);
        state = 'playing';
      }
    }
    return;
  }
  if (state === 'win') return;
  if (state !== 'playing') return;

  // ── 输入处理 ──
  if (input.jump && input.jumpPressed && player.onGround) {
    player.vy = JUMP_SPEED;
    player.onGround = false;
    player.onMovingPlatform = null;
    input.jumpPressed = false;
  }
  if (!input.jump) input.jumpPressed = true;

  if (input.left) {
    player.vx = -MOVE_SPEED;
    player.facingRight = false;
  } else if (input.right) {
    player.vx = MOVE_SPEED;
    player.facingRight = true;
  } else {
    player.vx *= 0.7;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
  }

  // ── 移动平台更新 ──
  const movingPlatforms = levelData.entities.filter(e => e.type === 'moving');
  const oldMPositions = movingPlatforms.map(mp => ({ mp, x: mp.x, y: mp.y }));

  for (const mp of movingPlatforms) {
    mp.x += mp.dx;
    mp.y += mp.dy;
    if (mp.rx && (mp.x <= mp.ox - mp.rx || mp.x >= mp.ox + mp.rx)) mp.dx *= -1;
    if (mp.ry && (mp.y <= mp.oy - mp.ry || mp.y >= mp.oy + mp.ry)) mp.dy *= -1;
  }

  // ── 玩家随移动平台移动 ──
  if (player.onMovingPlatform) {
    const oldMP = oldMPositions.find(o => o.mp === player.onMovingPlatform);
    if (oldMP) {
      player.x += (player.onMovingPlatform.x - oldMP.x);
      player.y += (player.onMovingPlatform.y - oldMP.y);
    }
  }

  // ── 重力 ──
  player.vy += GRAVITY;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  // ── 水平移动 ──
  player.x += player.vx;
  // 水平碰撞
  const allSolids = levelData.entities.filter(e =>
    e.type === 'static' || e.type === 'moving' || (e.type === 'crumb' && e.alive)
  );
  for (const s of allSolids) {
    const pw = s.w || s.type === 'moving' ? (s.w || 90) : (s.w || 80);
    const ph = s.h || (s.type === 'moving' ? (s.h || 18) : (s.h || 16));
    if (aabbOverlap(player, { x: s.x, y: s.y, w: pw, h: ph })) {
      if (player.vx > 0) {
        player.x = s.x - player.w;
      } else if (player.vx < 0) {
        player.x = s.x + pw;
      }
      player.vx = 0;
    }
  }

  // ── 垂直移动 ──
  player.y += player.vy;
  player.onGround = false;
  player.onMovingPlatform = null;

  for (const s of allSolids) {
    const pw = s.w || (s.type === 'moving' ? 90 : 80);
    const ph = s.h || (s.type === 'moving' ? 18 : 16);
    if (aabbOverlap(player, { x: s.x, y: s.y, w: pw, h: ph })) {
      if (player.vy > 0) {
        // 落在平台上方
        player.y = s.y - player.h;
        player.vy = 0;
        player.onGround = true;
        if (s.type === 'moving') player.onMovingPlatform = s;
        // 易碎平台
        if (s.type === 'crumb' && s.alive) {
          s.alive = false;
          spawnParticles(s.x + pw/2, s.y + ph/2, 8, '#aaa', 2);
        }
      } else if (player.vy < 0) {
        // 头顶碰到
        player.y = s.y + ph;
        player.vy = 0;
      }
    }
  }

  // ── 尖刺检测 ──
  const spikes = levelData.entities.filter(e => e.type === 'spike');
  const spikeHitboxH = 22; // 尖刺有效碰撞高度
  for (const sp of spikes) {
    const sh = spikeHitboxH;
    const sw = sp.w;
    const sx = sp.x;
    const sy = sp.y - sh;
    if (aabbOverlap(player, { x: sx, y: sy, w: sw, h: sh })) {
      killPlayer();
      return;
    }
  }

  // ── 掉落死亡 ──
  if (player.y > WORLD_H + 60) {
    killPlayer();
    return;
  }

  // ── 金币收集 ──
  const coins = levelData.entities.filter(e => e.type === 'coin');
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    if (rectCircleOverlap(player.x, player.y, player.w, player.h, c.x, c.y, 10)) {
      score += 10;
      spawnParticles(c.x, c.y, 5, '#FFD700', 2);
      levelData.entities.splice(levelData.entities.indexOf(c), 1);
    }
  }

  // ── 门检测 ──
  const door = levelData.entities.find(e => e.type === 'door');
  if (door && aabbOverlap(player, { x: door.x, y: door.y, w: door.w, h: door.h })) {
    state = 'levelEnd';
    levelEndTimer = 90;
    spawnParticles(door.x + door.w/2, door.y + door.h/2, 20, '#FFD700', 4);
    spawnParticles(door.x + door.w/2, door.y + door.h/2, 15, '#fff', 3);
  }

  // ── 摄像机 ──
  camera.tx = player.x + player.w/2 - canvas.width / 2;
  camera.ty = player.y + player.h/2 - canvas.height * 0.45;
  // 摄像机看向前方
  if (player.facingRight) camera.tx += 60;
  else camera.tx -= 60;
  camera.tx = Math.max(0, Math.min(camera.tx, levelData.w - canvas.width));
  camera.ty = Math.max(0, Math.min(camera.ty, WORLD_H - canvas.height));
  camera.x += (camera.tx - camera.x) * 0.12;
  camera.y += (camera.ty - camera.y) * 0.12;
  coinSpin += 0.05;

  // ── 震屏衰减 ──
  if (shakeTimer > 0) shakeTimer--;

  updateParticles();
}

function killPlayer() {
  lives--;
  spawnParticles(player.x + player.w/2, player.y + player.h/2, 15, '#e74c3c', 3);
  shakeTimer = 12;
  shakeIntensity = 8;
  state = 'dead';
  deadTimer = 60;
}

// ─── 渲染 ──────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let sx = 0, sy = 0;
  if (shakeTimer > 0) {
    const s = shakeIntensity * (shakeTimer / 12);
    sx = (Math.random() - 0.5) * s * 2;
    sy = (Math.random() - 0.5) * s * 2;
  }

  const cx = camera.x + sx;
  const cy = camera.y + sy;

  if (state === 'menu') {
    drawMenu();
    return;
  }
  if (state === 'win') {
    drawWin();
    return;
  }

  // 背景
  const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgGrad.addColorStop(0, levelData.bgTop);
  bgGrad.addColorStop(1, levelData.bgBot);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 远背景装饰
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for (let i = 0; i < 20; i++) {
    const sx2 = (i * 193 + 47) % levelData.w;
    const sy2 = 80 + (i * 137) % 400;
    ctx.beginPath();
    ctx.arc(sx2 - cx * 0.3, sy2, 4 + (i%6), 0, Math.PI*2);
    ctx.fill();
  }

  // 绘制所有实体
  for (const e of levelData.entities) {
    const sx_e = e.x - cx;
    const sy_e = e.y - cy;
    if (sx_e > canvas.width + 50 || sx_e + (e.w||80) < -50) continue;

    switch (e.type) {
      case 'static':
        drawPlatform(sx_e, sy_e, e.w, e.h, '#5D4E37', '#3D2E1F');
        // 顶部草地
        ctx.fillStyle = '#6B9B37';
        ctx.fillRect(sx_e, sy_e, e.w, Math.min(8, e.h));
        break;

      case 'moving':
        drawPlatform(sx_e, sy_e, e.w, e.h, '#7B68AE', '#4A3F7A');
        ctx.fillStyle = '#9B8FCE';
        ctx.fillRect(sx_e, sy_e, e.w, 5);
        // 光晕
        ctx.fillStyle = 'rgba(180,160,255,0.25)';
        ctx.fillRect(sx_e-3, sy_e-3, e.w+6, e.h+6);
        break;

      case 'crumb':
        if (!e.alive) break;
        drawPlatform(sx_e, sy_e, e.w, e.h, '#8a8a8a', '#5a5a5a');
        // 裂纹
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx_e + e.w*0.3, sy_e);
        ctx.lineTo(sx_e + e.w*0.5, sy_e + e.h*0.6);
        ctx.lineTo(sx_e + e.w*0.7, sy_e + e.h*0.9);
        ctx.stroke();
        break;

      case 'spike':
        const sh = 24;
        const spTop = sy_e - sh;
        const spW = e.w;
        const spCount = Math.max(1, Math.floor(spW / 18));
        const spStep = spW / spCount;
        ctx.fillStyle = '#e74c3c';
        ctx.strokeStyle = '#c0392b';
        ctx.lineWidth = 1.5;
        for (let i = 0; i < spCount; i++) {
          const spx = sx_e + spStep * i;
          ctx.beginPath();
          ctx.moveTo(spx, sy_e);
          ctx.lineTo(spx + spStep/2, spTop);
          ctx.lineTo(spx + spStep, sy_e);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        // 发光
        ctx.fillStyle = 'rgba(255,60,40,0.2)';
        ctx.fillRect(sx_e, spTop, spW, sh + 4);
        break;

      case 'coin':
        ctx.save();
        ctx.translate(sx_e, sy_e - cy);
        const sc = Math.abs(Math.cos(coinSpin + sx_e * 0.01)) * 0.3 + 0.7;
        ctx.scale(sc, 1);
        ctx.fillStyle = '#FFD700';
        ctx.strokeStyle = '#B8860B';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#FFF8DC';
        ctx.beginPath();
        ctx.arc(-2, -2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        break;

      case 'door':
        // 门框
        ctx.fillStyle = '#2C1810';
        ctx.fillRect(sx_e - 4, sy_e - 4, e.w + 8, e.h + 8);
        // 门洞发光
        const glowGrad = ctx.createLinearGradient(sx_e, sy_e, sx_e, sy_e + e.h);
        glowGrad.addColorStop(0, '#FFE082');
        glowGrad.addColorStop(0.5, '#FFB300');
        glowGrad.addColorStop(1, '#FF8F00');
        ctx.fillStyle = glowGrad;
        ctx.fillRect(sx_e + 4, sy_e + 4, e.w - 8, e.h - 8);
        // 光芒
        ctx.fillStyle = 'rgba(255,200,50,0.3)';
        ctx.beginPath();
        ctx.arc(sx_e + e.w/2, sy_e + e.h/2, 40 + Math.sin(Date.now()*0.004)*5, 0, Math.PI*2);
        ctx.fill();
        // 箭头标记
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('▼', sx_e + e.w/2, sy_e - 10);
        break;
    }
  }

  // 玩家
  drawPlayer(player.x - cx, player.y - cy);

  // 粒子
  drawParticles(ctx, cx, cy);

  // HUD
  drawHUD(cx, cy);
}

function drawPlatform(x, y, w, h, topColor, sideColor) {
  ctx.fillStyle = sideColor;
  ctx.fillRect(x, y + 6, w, h - 6);
  ctx.fillStyle = topColor;
  ctx.fillRect(x, y, w, h);
  // 亮边
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(x, y, w, 3);
}

function drawPlayer(px, py) {
  ctx.save();
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(px + 2, py + 2, PLR_W, PLR_H);

  // 身体
  const bodyGrad = ctx.createLinearGradient(px, py, px, py + PLR_H);
  bodyGrad.addColorStop(0, '#5DADE2');
  bodyGrad.addColorStop(1, '#2E86C1');
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(px, py, PLR_W, PLR_H);

  // 边框
  ctx.strokeStyle = '#1B4F72';
  ctx.lineWidth = 2;
  ctx.strokeRect(px, py, PLR_W, PLR_H);

  // 眼睛
  const eyeX = player.facingRight ? px + PLR_W - 10 : px + 10;
  const eyeY = py + 10;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(eyeX, eyeY, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  const pupilX = player.facingRight ? eyeX + 2 : eyeX - 2;
  ctx.arc(pupilX, eyeY + 1, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // 小脚
  ctx.fillStyle = '#1B4F72';
  ctx.fillRect(px + 3, py + PLR_H - 4, 8, 4);
  ctx.fillRect(px + PLR_W - 11, py + PLR_H - 4, 8, 4);

  // 如果站在移动平台上，显示一点效果
  if (player.onMovingPlatform) {
    ctx.fillStyle = 'rgba(180,160,255,0.3)';
    ctx.fillRect(px - 2, py + PLR_H, PLR_W + 4, 3);
  }

  ctx.restore();
}

function drawHUD(cx, cy) {
  // 半透明背景条
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, canvas.width, 36);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`❤️ x ${lives}`, 12, 26);
  ctx.textAlign = 'center';
  ctx.fillText(levelData.name, canvas.width/2, 26);
  ctx.textAlign = 'right';
  ctx.fillText(`🪙 ${score}`, canvas.width - 12, 26);

  // 如果状态为dead
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 32px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(lives > 0 ? '💀 再来一次!' : '游戏结束', canvas.width/2, canvas.height/2 - 10);
    if (lives > 0) {
      ctx.fillStyle = '#fff';
      ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(`剩余生命: ${lives}`, canvas.width/2, canvas.height/2 + 30);
    }
  }

  if (state === 'levelEnd') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎉 过关!', canvas.width/2, canvas.height/2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
    const nextName = curLevel + 1 < levels.length ? levels[curLevel+1].name : '通关!';
    ctx.fillText(`下一关: ${nextName}`, canvas.width/2, canvas.height/2 + 30);
  }
}

function drawMenu() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#1a1a3e');
  grad.addColorStop(1, '#0a0a1e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 装饰星星
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 191 + 37) % canvas.width;
    const sy = (i * 73 + 23) % (canvas.height * 0.6);
    ctx.beginPath();
    ctx.arc(sx, sy, 1.2 + (i%3), 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = '#FFD700';
  ctx.font = `bold ${Math.min(36, canvas.width*0.08)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('⚔️ 冒险跳跃 ⚔️', canvas.width/2, canvas.height * 0.28);

  ctx.fillStyle = '#ccc';
  ctx.font = `${Math.min(16, canvas.width*0.038)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillText('穿越陷阱与机关，抵达终点!', canvas.width/2, canvas.height * 0.36);

  // 操作说明
  const yStart = canvas.height * 0.46;
  const lineH = Math.min(26, canvas.width*0.055);
  ctx.fillStyle = '#aaa';
  ctx.font = `${Math.min(14, canvas.width*0.034)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillText('📱 手机: 屏幕底部按钮操控', canvas.width/2, yStart);
  ctx.fillText('⌨  电脑: 方向键/A D 移动, 空格跳跃', canvas.width/2, yStart + lineH);
  ctx.fillText(`🏆 共 ${levels.length} 关 · 收集金币 · 避开陷阱`, canvas.width/2, yStart + lineH * 2);

  // 开始按钮
  const btnW = Math.min(200, canvas.width * 0.5);
  const btnH = 50;
  const btnX = canvas.width/2 - btnW/2;
  const btnY = canvas.height * 0.68;
  ctx.fillStyle = '#FF8F00';
  ctx.strokeStyle = '#FFB300';
  ctx.lineWidth = 3;
  roundRect(btnX, btnY, btnW, btnH, 25);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(20, canvas.width*0.045)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillText('开始冒险', canvas.width/2, btnY + 33);

  // 存储按钮位置用于点击检测
  canvas._menuBtn = { x: btnX, y: btnY, w: btnW, h: btnH };
}

function drawWin() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#1a3a1a');
  grad.addColorStop(1, '#0a1a0a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#FFD700';
  ctx.font = `bold ${Math.min(34, canvas.width*0.075)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('🏆 恭喜通关! 🏆', canvas.width/2, canvas.height * 0.3);
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.min(18, canvas.width*0.04)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillText(`总分: ${score} 金币`, canvas.width/2, canvas.height * 0.42);
  ctx.fillText(`剩余生命: ${lives}`, canvas.width/2, canvas.height * 0.50);

  // 重新开始按钮
  const btnW = Math.min(200, canvas.width * 0.5);
  const btnH = 50;
  const btnX = canvas.width/2 - btnW/2;
  const btnY = canvas.height * 0.6;
  ctx.fillStyle = '#4CAF50';
  roundRect(btnX, btnY, btnW, btnH, 25);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(18, canvas.width*0.04)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillText('再来一次', canvas.width/2, btnY + 33);
  canvas._winBtn = { x: btnX, y: btnY, w: btnW, h: btnH };
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

// ─── 游戏循环 ──────────────────────────
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ─── 画布尺寸调整 ──────────────────────
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

// ─── 键盘控制 ──────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    input.jump = true;
    if (state === 'menu') startGame();
    if (state === 'win') resetGameAndStart();
    e.preventDefault();
  }
  if (e.code === 'ArrowDown') e.preventDefault();
  if (state === 'menu' && (e.code === 'Enter' || e.code === 'Space')) startGame();
  if (state === 'win' && e.code === 'Enter') resetGameAndStart();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = !!keys['ArrowLeft'] || !!keys['KeyA'];
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = !!keys['ArrowRight'] || !!keys['KeyD'];
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    input.jump = false;
    input.jumpPressed = true;
  }
});

// ─── 触摸控制 ──────────────────────────
function setupTouchButton(el, onDown, onUp) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); onDown(); });
  el.addEventListener('pointerup', e => { e.preventDefault(); onUp(); });
  el.addEventListener('pointerleave', e => { onUp(); });
  el.addEventListener('pointercancel', e => { onUp(); });
}

setupTouchButton(btnLeft,  () => { input.left = true;  }, () => { input.left = false;  });
setupTouchButton(btnRight, () => { input.right = true; }, () => { input.right = false; });
setupTouchButton(btnJump,  () => {
  input.jump = true;
  if (state === 'menu') startGame();
  if (state === 'win') resetGameAndStart();
}, () => { input.jump = false; input.jumpPressed = true; });

// ─── Canvas 点击(菜单按钮) ──────────────
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  if (state === 'menu' && canvas._menuBtn) {
    const b = canvas._menuBtn;
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      startGame();
    }
  }
  if (state === 'win' && canvas._winBtn) {
    const b = canvas._winBtn;
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      resetGameAndStart();
    }
  }
});

function startGame() {
  resetGame();
  initLevel(0);
  state = 'playing';
}

function resetGameAndStart() {
  resetGame();
  initLevel(0);
  state = 'playing';
}

// ─── 启动 ──────────────────────────────
function init() {
  resizeCanvas();
  resetGame();
  initLevel(0);
  state = 'menu';
  requestAnimationFrame(gameLoop);
}

init();

})();
</script>
